<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { width: 260px; font: 13px/1.4 sans-serif; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; margin: 8px 0 4px; font-weight: 600; }
  input[type="number"] { width: 100%; box-sizing: border-box; padding: 4px 6px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  #start { background: #16a34a; color: #fff; }
  #stop { background: #dc2626; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 10px; padding: 8px; background: #f3f4f6; border-radius: 6px; }
  #note { margin-top: 8px; font-size: 11px; color: #6b7280; }
  .logo-wrap { text-align: center; margin-bottom: 4px; }
  .logo-wrap img { width: 64px; height: auto; }
  .footer {
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid #e5e7eb;
    text-align: center;
    font-size: 11px;
    color: #6b7280;
  }
  .footer a { color: #2563eb; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="logo-wrap">
    <img src="logo-popup.png" alt="Bangladesh College of Physicians and Surgeons">
  </div>
  <h1>BCPS Logbook Bulk Approver</h1>

  <label for="delay">Delay between approvals (ms)</label>
  <input type="number" id="delay" value="1200" min="400" step="100">

  <div class="row">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
  </div>

  <div id="status">Not connected to logbook page.</div>
  <div id="note">Open the "E-Logbook Entry List For Approval" page first. It keeps going, page by page, until stopped or no Pending entries remain.</div>

  <div class="footer">
    Developed by
    <a href="https://www.facebook.com/AAbdullahAlMaruf/" target="_blank" rel="noopener noreferrer">
      Maruf - 01770578663
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
